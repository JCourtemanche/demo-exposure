# ============================================================
# Business Corp — Source de vérité unique pour la démo Exposure Management
# ============================================================
#
# ⚠️  v1 : Rapid7 InsightVM est la SEULE source de vulnérabilités active.
# Cyberwatch a été abandonné en v1 (pack Partner Contribution alimente
# `cyberwatch_generic_alert_raw`, PAS `asset_inventory` d'Exposure
# Management). Il reste dans la roadmap v2 via la Vulnerability Ingest API.
# → Les champs cw_* ci-dessous sont conservés pour compatibilité future v2.
# → Le hero pinning ne cible plus que `source: rapid7`.
#
# Ce fichier décrit :
#   1. Les assets custom à AJOUTER aux 12 servers natifs du sim Rapid7
#   2. Le pinning des paires (asset, CVE) pour garantir que les 6 hero cases
#      apparaissent bien dans XSIAM après ingestion
#
# Workflow d'utilisation :
#   1. Éditer ce fichier
#   2. `python config/sync-config-to-sims.py` — génère business_corp_overrides.py
#      dans le fork sim
#   3. `cd <fork-rapid7> && bash deploy-cloudrun.sh`
#   4. Attendre 5-15 min ingestion sim → puis ~2h supplémentaires pour que
#      Cortex peuple `uvm_findings` (délai d'ingestion Vulnerability Intelligence)
#   5. Valider via runbook/08-validation-checklist.md
#
# Format des CVE : utiliser l'ID canonique CVE-YYYY-NNNN. Toutes les CVE
# référencées ici doivent exister dans le catalogue du sim source
# (voir config/catalogs-inventory.md pour la liste des 40 CVE de chaque sim).
# ============================================================

version: 1
company: business.org

# ------------------------------------------------------------
# 1. EXTRA ASSETS — actifs custom ajoutés au-delà des 12 natifs Rapid7
# ------------------------------------------------------------
#
# Ces assets sont ajoutés à EXTRA_SERVER_SEED dans le sim Rapid7.
# Format Rapid7 (tuple 4) : hostname, ip, os (nom complet), site_id
#
# `zone_hint` et `owner_hint` sont documentaires (pour runbook 05 tagging).
# Ils NE SONT PAS injectés dans le sim (car le sim n'a pas ces champs)
# — le tagging XSIAM se fait après ingestion via `bulk-tag-assets.py`.
#
# Les champs cw_* sont conservés pour compatibilité future v2 (Cyberwatch).
# ------------------------------------------------------------

extra_assets:

  - hostname: srv-portail.business.org
    ip: 10.10.20.61
    os: Ubuntu 22.04 LTS
    site_id: 1
    zone_hint: dmz-web
    owner_hint: appdev
    tier_hint: 1
    inject_in: [rapid7]
    # v2 (Cyberwatch) — préservé pour usage futur
    cw_os_key: ubuntu_2204_64
    cw_category: server
    cw_description: "Portail public de transfert de fichiers (type MOVEit)"
    cw_groups: [601, 610, 620]

  - hostname: srv-adfs-01.business.org
    ip: 10.10.20.62
    os: Windows Server 2022
    site_id: 1
    zone_hint: tier0
    owner_hint: secops
    tier_hint: 0
    inject_in: [rapid7]
    cw_os_key: windows_2022
    cw_category: server
    cw_description: "AD Federation Services (SSO SAML/OIDC)"
    cw_groups: [601, 620]

  - hostname: srv-print.business.org
    ip: 10.10.20.63
    os: Windows Server 2019
    site_id: 1
    zone_hint: infra
    owner_hint: it-corp
    tier_hint: 3
    inject_in: [rapid7]
    cw_os_key: windows_2019
