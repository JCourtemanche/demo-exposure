# ------------------------------------------------------------
# 2. HERO PINNING — garantir des paires (asset, CVE) précises
# ------------------------------------------------------------
#
# Pour chaque hero case du narratif, on garantit qu'une CVE spécifique est
# assignée à un asset spécifique. Le patch dans generators/assets.py ajoute
# ces CVEs à la liste `r.sample(...)` avant retour.
#
# `source: rapid7` — v1 Rapid7 only.
# `source: cyberwatch` ou `both` réservés v2 (Cyberwatch via API Ingest).
# ------------------------------------------------------------

hero_pinning:

  # Hero 1 — Urgence Périmètre (CVRS ≥ 90 + Internet Exposed)
  - asset: srv-vpn.business.org
    cves: [CVE-2024-3400]        # PAN-OS GlobalProtect
    source: rapid7
    narrative: "Urgence Périmètre — VPN box exposé, exploitation active (KEV)"

  # Hero 2 — Arme aux mains de l'ennemi (KEV + Internet Exposed)
  - asset: srv-mail.business.org
    cves: [CVE-2021-26855]       # ProxyLogon
    source: rapid7
    narrative: "KEV — Exchange exposé, ProxyLogon dans catalogue CISA"

  # Hero 3 — Le Maillon Faible (CVSS ≥ 8 + Compensating Control = None)
  # v1 : migré depuis esxi-01 (Cyberwatch-only) vers srv-adfs-01 (extra BC Rapid7).
  # Narrative : ADFS Tier 0 identity federation, souvent traité comme appliance,
  # pas d'agent Cortex XDR déployé → Zerologon (CVSS 10) exploitable en interne.
  - asset: srv-adfs-01.business.org
    cves: [CVE-2020-1472]        # Zerologon (Netlogon protocol vuln — pertinent pour ADFS)
    source: rapid7
    narrative: "Maillon Faible — ADFS Tier 0 sans agent XDR, Zerologon CVSS 10"

  # Hero 4 — Menace Imminente EPSS (EPSS > 90% + Internet Exposed)
  # v1 : migré depuis alice+Follina (Cyberwatch endpoint) vers srv-web-01+Spring4Shell.
  # Narrative : serveur web DMZ exposé Internet, Spring4Shell CVSS 9.8 + EPSS élevé
  # → exploitation attendue imminemment par scanners automatiques.
  - asset: srv-web-01.business.org
    cves: [CVE-2022-22965]       # Spring4Shell — CVSS 9.8, EPSS élevé, exposé
    source: rapid7
    narrative: "EPSS élevé — Spring4Shell sur serveur web DMZ, exploitation imminente"

  # Hero 5 — Risque Confirmé Workload (CVRS ≥ 70 + Package-in-use)
  - asset: srv-ci.business.org
    cves: [CVE-2021-44228]       # Log4Shell
    source: rapid7
    narrative: "Log4Shell sur CI Java — Package In Use validé par AST"

  # Hero 6 — Nettoyage de Surface (CVRS 60-80 + Internet Exposed)
  - asset: srv-portail.business.org
    cves: [CVE-2016-3189]        # bzip2 use-after-free (modéré)
    source: rapid7
    narrative: "Vuln modérée sur portail public — hygiène ASM"

# ------------------------------------------------------------
# 3. INTERNET EXPOSURE — IPs publiques pour marquer les assets exposés
# ------------------------------------------------------------
#
# Cortex Exposure Management évalue l'Internet Exposure via ASM/CNA/AST.
# Sans addon ASM (Xpanse), Cortex peut néanmoins déduire l'exposition à
# partir de la présence d'une IP publique dans le champ `addresses` de
# l'asset ingéré.
#
# On enrichit donc les assets stratégiques (VPN, web DMZ, mail, portail,
# smtp-relay) avec une IP publique en plus de leur IP privée. Le sim
# émet ainsi `addresses: [{"ip": "10.10.20.51"}, {"ip": "203.0.113.10"}]`.
#
# Range utilisé : 203.0.113.0/24 (RFC 5737 TEST-NET-3, non-routable — safe
# pour démo, aucun risque d'atteindre une vraie ressource).
# ------------------------------------------------------------

additional_public_ips:
  srv-vpn.business.org:     203.0.113.5   # Hero 1 — VPN box
  srv-web-01.business.org:  203.0.113.10  # Hero 4 — front web (Spring4Shell)
  srv-web-02.business.org:  203.0.113.11  # front web redondant
  srv-mail.business.org:    203.0.113.20  # Hero 2 — Exchange OWA (ProxyLogon)
  srv-portail.business.org: 203.0.113.30  # Hero 6 — portail transfert
  smtp-relay.business.org:  203.0.113.40  # relais mail sortant

# ------------------------------------------------------------
# 4. ASSET TAGS — émis nativement par le sim pour auto-ingestion XSIAM
# ------------------------------------------------------------
#
# Le sim Rapid7 expose GET /api/3/assets/<id>/tags qui retourne les tags
# de l'asset. Cortex ingère ces tags dans `xdm.asset.tags` (visible dans
# `xdm.asset.normalized_fields`), format `{name: type}`.
#
# En peuplant ces tags directement dans le sim, on évite l'étape manuelle
# de bulk-tagging dans XSIAM (runbook 05 § 5.2 obsolète en v1.2).
#
# Format ci-dessous : `hostname: {key: value, ...}`
# Chaque paire key:value devient un tag Rapid7 nommé "key:value" de type
# "custom" — ingéré comme `xdm.asset.tags."key:value" = "custom"`.
#
# Les asset groups XSIAM (runbook 05 § 5.3-5.5) filtrent ensuite sur
# ces tags pour créer les groupes dynamiques EM-demo-zone-*, EM-demo-owner-*, etc.
# ------------------------------------------------------------

asset_tags:
  # === Natifs Rapid7 (12 servers + personas) ===
  srv-web-01.business.org:     {zone: dmz-web,   owner: appdev,  tier: "1"}
  srv-web-02.business.org:     {zone: dmz-web,   owner: appdev,  tier: "1"}
  srv-db-01.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-db-02.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-mail.business.org:       {zone: tier1,     owner: it-corp, tier: "1"}
  srv-ad-01.business.org:      {zone: tier0,     owner: secops,  tier: "0"}
  srv-fs-01.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-vpn.business.org:        {zone: dmz-edge,  owner: secops,  tier: "0"}
  srv-monitoring.business.org: {zone: tier1,     owner: it-corp, tier: "2"}
  srv-ci.business.org:         {zone: cicd,      owner: devops,  tier: "1"}
  cloud-lb-01.business.org:    {zone: cloud,     owner: devops,  tier: "2"}
  cloud-app-01.business.org:   {zone: cloud,     owner: devops,  tier: "2"}
  # === Extras BC (injectés via extra_assets ci-dessus) ===
  srv-portail.business.org:    {zone: dmz-web,   owner: appdev,  tier: "1"}
  srv-adfs-01.business.org:    {zone: tier0,     owner: secops,  tier: "0"}
  srv-print.business.org:      {zone: infra,     owner: it-corp, tier: "3"}
  smtp-relay.business.org:     {zone: dmz-edge,  owner: it-corp, tier: "2"}

