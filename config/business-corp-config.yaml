# ============================================================
# Business Corp — Source de vérité unique pour la démo Exposure Management
# ============================================================
#
# ⚠️  v1 : Rapid7 InsightVM est la SEULE source de vulnérabilités active.
# Cyberwatch a été abandonné en v1 (pack Partner Contribution alimente
# `cyberwatch_generic_alert_raw`, PAS `asset_inventory` d'Exposure
# Management). Il reste dans la roadmap v2 via la Vulnerability Ingest API.
# → Les champs cw_* ci-dessous sont conservés pour compatibilité future v2.
# → Le hero pinning ne cible plus que `source: rapid7`.
#
# Ce fichier décrit :
#   1. Les assets custom à AJOUTER aux 12 servers natifs du sim Rapid7
#   2. Le pinning des paires (asset, CVE) pour garantir que les 6 hero cases
#      apparaissent bien dans XSIAM après ingestion
#   3. (v1.4) Les rôles logiciels et surcharges d'OS qui garantissent la
#      cohérence CVE / asset : le sim ne tire que des CVE applicables à l'OS
#      et aux rôles de chaque asset (pas d'Exchange sur un Mac)
#
# Workflow d'utilisation :
#   1. Éditer ce fichier
#   2. `python config/sync-config-to-sims.py` — génère business_corp_overrides.py
#      dans le fork sim
#   3. `cd <fork-rapid7> && bash deploy-cloudrun.sh`
#   4. Attendre 5-15 min ingestion sim → puis ~2h supplémentaires pour que
#      Cortex peuple `uvm_findings` (délai d'ingestion Vulnerability Intelligence)
#   5. Valider via runbook/08-validation-checklist.md
#
# Format des CVE : utiliser l'ID canonique CVE-YYYY-NNNN. Toutes les CVE
# référencées ici doivent exister dans le catalogue du sim source
# (voir config/catalogs-inventory.md pour la liste des 49 CVE du sim Rapid7).
# ============================================================

version: 1
company: business.org

# ------------------------------------------------------------
# 1. EXTRA ASSETS — actifs custom ajoutés au-delà des 12 natifs Rapid7
# ------------------------------------------------------------
#
# Ces assets sont ajoutés à EXTRA_SERVER_SEED dans le sim Rapid7.
# Format Rapid7 (tuple 4) : hostname, ip, os (nom complet), site_id
#
# `roles` (v1.4) : rôles logiciels de l'asset, en plus de la plateforme déduite
# de l'OS. Ils décident quelles CVE du catalogue l'asset peut porter (voir
# CVE_REQUIREMENTS dans generators/vulnerabilities.py du sim Rapid7).
# Rôles disponibles : exchange, domain-controller, java, web, php, teamcity,
# activemq, mft, postgresql, grafana, smtp.
#
# `zone_hint` et `owner_hint` sont documentaires (pour runbook 05 tagging).
# Ils NE SONT PAS injectés dans le sim (car le sim n'a pas ces champs)
# — le tagging XSIAM se fait après ingestion via `bulk-tag-assets.py`.
#
# Les champs cw_* sont conservés pour compatibilité future v2 (Cyberwatch).
# ------------------------------------------------------------

extra_assets:

  - hostname: srv-portail.business.org
    ip: 10.10.20.61
    os: Ubuntu 22.04 LTS
    site_id: 1
    zone_hint: dmz-web
    owner_hint: appdev
    tier_hint: 1
    roles: [java, mft]            # portail de transfert type GoAnywhere MFT (Java, Linux)
    inject_in: [rapid7]
    # v2 (Cyberwatch) — préservé pour usage futur
    cw_os_key: ubuntu_2204_64
    cw_category: server
    cw_description: "Portail public de transfert de fichiers (type GoAnywhere MFT)"
    cw_groups: [601, 610, 620]

  - hostname: srv-adfs-01.business.org
    ip: 10.10.20.62
    os: Windows Server 2022
    site_id: 1
    zone_hint: tier0
    owner_hint: secops
    tier_hint: 0
    roles: []                     # pas de CVE ADFS au catalogue : CVE Windows Server uniquement
    inject_in: [rapid7]
    cw_os_key: windows_2022
    cw_category: server
    cw_description: "AD Federation Services (SSO SAML/OIDC)"
    cw_groups: [601, 620]

  - hostname: srv-print.business.org
    ip: 10.10.20.63
    os: Windows Server 2019
    site_id: 1
    zone_hint: infra
    owner_hint: it-corp
    tier_hint: 3
    roles: []                     # spouleur d'impression : PrintNightmare (couvert par windows-server)
    inject_in: [rapid7]
    cw_os_key: windows_2019
    cw_category: server
    cw_description: "Print server corporate (souvent oublié patch)"
    cw_groups: [601, 620]

  - hostname: smtp-relay.business.org
    ip: 10.10.20.64
    os: Debian 12
    site_id: 1
    zone_hint: dmz-edge
    owner_hint: it-corp
    tier_hint: 2
    roles: [smtp]                 # Postfix
    inject_in: [rapid7]
    cw_os_key: debian_12_64
    cw_category: server
    cw_description: "Relais SMTP sortant"
    cw_groups: [601, 620]

# ------------------------------------------------------------
# 2. HERO PINNING — garantir des paires (asset, CVE) précises
# ------------------------------------------------------------
#
# Pour chaque hero case du narratif, on garantit qu'une CVE spécifique est
# assignée à un asset spécifique. Le patch dans generators/assets.py ajoute
# ces CVEs à la liste `r.sample(...)` avant retour.
#
# `source: rapid7` — v1 Rapid7 only.
# `source: cyberwatch` ou `both` réservés v2 (Cyberwatch via API Ingest).
# ------------------------------------------------------------

hero_pinning:

  # v1.4 : heroes alignés sur les 5 policies réelles du tenant (évaluées dans l'ordre,
  # la première qui correspond gagne) :
  #   R1 Critical  KEV ou EPSS >= 90 %             scope : assets exposés (DMZ)
  #   R2 Critical  CVRS >= 90                       scope : assets exposés (DMZ)
  #   R3 High      KEV et CVRS >= 90                scope : tout Business Corp
  #   R4 High      CVRS >= 80 et Exploitable        scope : tout Business Corp
  #   R5 Medium    CVRS <= 89                       scope : assets exposés (DMZ)
  # Toutes les paires ci-dessous sont cohérentes avec l'OS et les rôles de l'asset.

  # Hero 1 — Urgence périmètre : pare-feu GlobalProtect exposé (PAN-OS, voir os_overrides) -> R1
  - asset: srv-vpn.business.org
    cves: [CVE-2024-3400]        # PAN-OS GlobalProtect, KEV, CVSS 10
    source: rapid7
    narrative: "Urgence périmètre — pare-feu VPN exposé, exploitation active (KEV), pas d'agent possible"

  # Hero 2 — Exploitation active : Exchange OWA exposé -> R1 (srv-mail doit être dans le groupe exposé)
  - asset: srv-mail.business.org
    cves: [CVE-2021-26855]       # ProxyLogon, KEV
    source: rapid7
    narrative: "KEV — Exchange exposé, ProxyLogon dans le catalogue CISA"

  # Hero 3 — Angle mort interne : contrôleur de domaine Tier 0 -> R3
  # v1.4 : déplacé de srv-adfs-01 vers srv-ad-01 (Zerologon touche les DC, pas ADFS).
  # Pour garder CVRS >= 90, ne pas déclarer de contrôle compensatoire XDR sur srv-ad-01 (runbook 06).
  - asset: srv-ad-01.business.org
    cves: [CVE-2020-1472]        # Zerologon (Netlogon), KEV, CVSS 10
    source: rapid7
    narrative: "Angle mort interne — DC Tier 0, Zerologon CVSS 10, mouvement latéral immédiat"

  # Hero 4 — Exploit prêt : front web Java exposé -> R1 (KEV sur asset exposé)
  - asset: srv-web-01.business.org
    cves: [CVE-2022-22965]       # Spring4Shell, KEV, CVSS 9.8
    source: rapid7
    narrative: "Spring4Shell sur serveur web DMZ, exploitation imminente"

  # Hero 5 — Risque confirmé workload : CI Java interne -> R3 (KEV + CVRS >= 90)
  - asset: srv-ci.business.org
    cves: [CVE-2021-44228]       # Log4Shell
    source: rapid7
    narrative: "Log4Shell sur CI Java — Package In Use validé par AST"

  # Hero 6 — Réduction de surface externe : vuln modérée sur portail exposé -> R5
  - asset: srv-portail.business.org
    cves: [CVE-2016-3189]        # bzip2 use-after-free (modéré)
    source: rapid7
    narrative: "Vuln modérée sur portail public — hygiène de surface"

  # Illustration R2 — critique non KEV sur asset exposé (CVRS observé ~97 sur le tenant)
  - asset: srv-web-01.business.org
    cves: [CVE-2024-38063]       # Windows TCP/IP RCE, non KEV
    source: rapid7
    narrative: "R2 — faille critique contextualisée sur front web exposé"

  # Illustration R4 — exploitable non KEV sur asset interne (CVRS >= 80 à valider)
  - asset: srv-ci.business.org
    cves: [CVE-2024-23917]       # TeamCity auth bypass, non KEV, CVSS 9.8
    source: rapid7
    narrative: "R4 — TeamCity exploitable, correctif disponible"

  # Scénario Intune (repo intune-simul) — postes utilisateurs remédiés via Intune
  - asset: BSNS-WIN-ALICE
    cves: [CVE-2024-38063]       # Windows TCP/IP, KB d'août 2024
    source: rapid7
    narrative: "Intune — hero : correctif Windows accéléré"
  - asset: BSNS-WIN-CHARLIE
    cves: [CVE-2024-38063]
    source: rapid7
    narrative: "Intune — Windows 11"
  - asset: BSNS-WIN-DAVID
    cves: [CVE-2024-38063]
    source: rapid7
    narrative: "Intune — Windows 10"
  - asset: BSNS-MAC-EMMA
    cves: [CVE-2023-42917]       # WebKit, macOS 14.1.2
    source: rapid7
    narrative: "Intune — mise à jour macOS"
  - asset: BSNS-MOB-FLORA
    cves: [CVE-2023-42917]       # WebKit, iOS 17.1.2
    source: rapid7
    narrative: "Intune — mise à jour iOS"

# ------------------------------------------------------------
# 2b. COHÉRENCE CVE / ASSET (v1.4)
# ------------------------------------------------------------
#
# os_overrides : remplace l'OS d'un asset natif du sim. La valeur doit exister
# dans EXTRA_OS (generators/base.py du sim Rapid7).
# asset_roles  : remplace les rôles logiciels d'un asset natif (ceux des assets
# ajoutés se déclarent dans extra_assets[].roles). Les rôles par défaut des
# natifs sont dans ASSET_ROLES (generators/assets.py du sim).
# ------------------------------------------------------------

os_overrides:
  srv-vpn.business.org: PAN-OS 10.2   # Hero 1 : CVE-2024-3400 est une faille PAN-OS, pas Ubuntu

asset_roles: {}
  # exemple : srv-fs-01.business.org: [web]

# ------------------------------------------------------------
# 3. INTERNET EXPOSURE — IP publique en REMPLACEMENT (v1.3 pivot)
# ------------------------------------------------------------
#
# Le pack Rapid7 XSIAM ingère via Data Warehouse endpoint qui ne remonte
# QU'UNE seule IP par asset (dim_asset_ip_address_ip_address mono-valué).
# Solution v1.3 : le patch bloc 6 apply-patches.py REMPLACE l'IP privée
# par l'IP publique dans le champ `ip` (et `addresses[0].ip`) de l'asset,
# quand l'asset apparaît dans additional_public_ips ci-dessous.
#
# Résultat côté XSIAM :
#   - dim_asset_ip_address_ip_address = ["203.0.113.5"]  (IP publique)
#   - ipv4 = "203.0.113.5"
#   - hostname reste "srv-vpn.business.org" (cohérence narrative)
#
# Cortex peut alors déduire Internet Exposed nativement depuis l'IP publique.
#
# Range utilisé : 203.0.113.0/24 (RFC 5737 TEST-NET-3, non-routable — safe démo).
# ------------------------------------------------------------

additional_public_ips:
  srv-vpn.business.org:     203.0.113.5   # Hero 1 — VPN box
  srv-web-01.business.org:  203.0.113.10  # Hero 4 — front web (Spring4Shell)
  srv-web-02.business.org:  203.0.113.11  # front web redondant
  srv-mail.business.org:    203.0.113.20  # Hero 2 — Exchange OWA (ProxyLogon)
  srv-portail.business.org: 203.0.113.30  # Hero 6 — portail transfert
  smtp-relay.business.org:  203.0.113.40  # relais mail sortant

# ------------------------------------------------------------
# 4. ASSET TAGS — émis nativement par le sim pour auto-ingestion XSIAM
# ------------------------------------------------------------
#
# Le sim Rapid7 expose GET /api/3/assets/<id>/tags qui retourne les tags
# de l'asset. Cortex ingère ces tags dans `xdm.asset.tags` (visible dans
# `xdm.asset.normalized_fields`), format `{name: type}`.
#
# En peuplant ces tags directement dans le sim, on évite l'étape manuelle
# de bulk-tagging dans XSIAM (runbook 05 § 5.2 obsolète en v1.2).
#
# Format ci-dessous : `hostname: {key: value, ...}`
# Chaque paire key:value devient un tag Rapid7 nommé "key:value" de type
# "custom" — ingéré comme `xdm.asset.tags."key:value" = "custom"`.
#
# Les asset groups XSIAM (runbook 05 § 5.3-5.5) filtrent ensuite sur
# ces tags pour créer les groupes dynamiques EM-demo-zone-*, EM-demo-owner-*, etc.
# ------------------------------------------------------------

# v1.4 : `exposure: internet` marque les 6 assets à IP publique. Cortex ne déduit
# pas Internet Exposed d'une IP remontée par un scanner (il faut ASM / CNA + scan
# externe, et la plage TEST-NET ne répond jamais) : les policies R1 / R2 / R5 se
# cadrent donc sur un asset group construit sur ce tag (runbook 05).
asset_tags:
  # === Natifs Rapid7 (12 servers + personas) ===
  srv-web-01.business.org:     {zone: dmz-web,   owner: appdev,  tier: "1", exposure: internet}
  srv-web-02.business.org:     {zone: dmz-web,   owner: appdev,  tier: "1", exposure: internet}
  srv-db-01.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-db-02.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-mail.business.org:       {zone: tier1,     owner: it-corp, tier: "1", exposure: internet}
  srv-ad-01.business.org:      {zone: tier0,     owner: secops,  tier: "0"}
  srv-fs-01.business.org:      {zone: tier1,     owner: it-corp, tier: "1"}
  srv-vpn.business.org:        {zone: dmz-edge,  owner: secops,  tier: "0", exposure: internet}
  srv-monitoring.business.org: {zone: tier1,     owner: it-corp, tier: "2"}
  srv-ci.business.org:         {zone: cicd,      owner: devops,  tier: "1"}
  cloud-lb-01.business.org:    {zone: cloud,     owner: devops,  tier: "2"}
  cloud-app-01.business.org:   {zone: cloud,     owner: devops,  tier: "2"}
  # === Extras BC (injectés via extra_assets ci-dessus) ===
  srv-portail.business.org:    {zone: dmz-web,   owner: appdev,  tier: "1", exposure: internet}
  srv-adfs-01.business.org:    {zone: tier0,     owner: secops,  tier: "0"}
  srv-print.business.org:      {zone: infra,     owner: it-corp, tier: "3"}
  smtp-relay.business.org:     {zone: dmz-edge,  owner: it-corp, tier: "2", exposure: internet}

